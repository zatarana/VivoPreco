<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>VivoPreco Clean Core Tests</title><style>body{font-family:system-ui;padding:20px;background:#f8fafc;color:#0f172a}.ok{color:#16a34a}.fail{color:#dc2626}pre{background:#0f172a;color:#dbeafe;padding:14px;border-radius:12px;white-space:pre-wrap}</style></head><body><h1>Testes — Clean Core</h1><pre id="out"></pre><script src="../js/core/models.js"></script><script src="../js/core/validators.js"></script><script src="../js/core/storage.js"></script><script src="../js/core/finance-engine.js"></script><script src="../js/core/debt-engine.js"></script><script src="../js/core/task-engine.js"></script><script>
const out=document.getElementById('out');const log=[];function assert(name,cond){log.push((cond?'✅':'❌')+' '+name);if(!cond)throw new Error(name)}function data(){return {wallets:[Models.wallet()],transactions:[],bills:[],debts:[],projects:[{id:'project_inbox',name:'Inbox',sections:['Entrada'],view:'list'}],tasks:[]}}
try{
let d=data();FinanceEngine.addTransaction(d,{type:'receita',value:1000,description:'Salário'});FinanceEngine.addTransaction(d,{type:'despesa',value:250,description:'Mercado'});assert('Saldo da carteira = receitas - despesas',FinanceEngine.totalWalletBalance(d)===750);
let bill=FinanceEngine.addBill(d,{name:'Energia',flow:'A_PAGAR',expected:200});assert('Conta criada fica pendente',FinanceEngine.payable(d)===200);FinanceEngine.settleBill(d,bill.id,200);assert('Conta paga zera pendente',FinanceEngine.payable(d)===0);assert('Conta paga gera despesa',FinanceEngine.expense(d)===450);
let debt=DebtEngine.addDebt(d,{name:'Cartão',original:1000,balance:1000,minPayment:100});assert('Cadastrar dívida não cria despesa',FinanceEngine.expense(d)===450);DebtEngine.pay(d,debt.id,300,300);assert('Pagamento de dívida cria despesa',FinanceEngine.expense(d)===750);assert('Pagamento reduz dívida',DebtEngine.total(d)===700);
let debt2=DebtEngine.addDebt(d,{name:'Acordo',original:600,balance:600});DebtEngine.renegotiate(d,debt2.id,500,5,Models.today());assert('Renegociação cria contas futuras',d.bills.filter(b=>b.debtId===debt2.id).length===5);assert('Renegociação não cria despesa imediata',FinanceEngine.expense(d)===750);
let task=TaskEngine.addTask(d,{title:'Teste',projectId:'project_inbox'});TaskEngine.complete(d,task.id);assert('Tarefa concluída',TaskEngine.completedTasks(d).length===1);
out.textContent=log.join('\n')+'\n\nTodos os testes principais passaram.';
}catch(e){log.push('ERRO: '+e.message);out.textContent=log.join('\n');out.className='fail';throw e;}
</script></body></html>
